name: Release

# Publishes the three packages with npm provenance. Runs only for version tags and
# waits for approval on the "npm-publish" environment (configure required reviewers in repo settings).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck && npm run lint && npm test && npm run test:security
      - run: npm publish -w seo-notary-core -w seo-notary-browser -w seo-notary --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
